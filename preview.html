<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>프리뷰 · 피클 홀로그램</title>
<style>
  html,body{margin:0;height:100%;background:#15171a;font:600 13px/1.4 -apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;color:#8b949e}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:14px}
  #label{letter-spacing:.06em}
  iframe{display:block;border:0;background:#000;box-shadow:0 0 0 1px #2b3038,0 10px 40px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div id="wrap">
  <div id="label"></div>
  <iframe id="f" allow="microphone"></iframe>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get('w') || '390', 10);
  var h = parseInt(q.get('h') || '844', 10);
  var f = document.getElementById('f');
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  f.src = 'index.html?v=' + (q.get('v') || '0');
  document.getElementById('label').textContent = w + ' × ' + h;
</script>
</body>
</html>
